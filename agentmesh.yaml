# agentmesh configuration
#
# Roles are NOT tied to agent type. The "master" is whichever agent you attach
# this MCP server to (see README). Everything below describes WORKERS the master
# can spawn. Mix and match freely: opencode master -> pi workers, pi master ->
# opencode workers, etc.

# where git worktrees and acpx session state live (relative to the run dir)
workdir: .agentmesh

# --- Resource & recursion limits --------------------------------------------
# A master is itself an agent, so a delegation chain (or a master↔worker loop)
# can recurse forever. agentmesh bounds the depth: it reads its own level from
# $AGENTMESH_DELEGATION_DEPTH (0 for a top-level master) and injects level+1 into
# every agent it spawns, so a nested agentmesh inherits the chain depth. A submit
# whose effective depth reaches the cap is refused without spawning a worker.
#
# Two further guards bound blast radius: maxConcurrentTasks caps how many tasks
# may run at once; maxOutputBytes caps the result text persisted per task,
# truncating on a UTF-8 boundary and flagging the record `outputTruncated` so a
# runaway agent cannot blow up the store.
#
# What happens to a submit that arrives while all slots are busy depends on
# maxQueuedTasks. Left at 0 (the default), the submit is refused immediately with
# `concurrency_limit_exceeded` — back-pressure, no waiting. Set it >0 to enable
# real scheduling: over-cap submits park in a bounded queue and drain
# automatically as running tasks settle, and only a submit that finds the queue
# full too is refused (`queue_full`). A queued task can still be cancelled and
# settles at once, without holding a worker.
#
# The queue is strict FIFO by default. Two knobs refine it:
#   • queueTtlMs — how long a task may WAIT before it expires (`timed_out` with
#     `queue_ttl_exceeded`) instead of being stranded behind a deep backlog.
#   • a profile's `weight` (see `profiles:` below) — 1 is neutral; any other
#     value switches the queue to weighted fair scheduling, so a weight-3 profile
#     gets ~3x the dispatch slots of a weight-1 one under contention.
# A per-task deadline (`task_submit { deadlineMs | deadlineAt }`) overrides both:
# it covers queue wait AND execution and settles `deadline_exceeded` when hit.
#
# maxHandoffBytes caps how much of a finished predecessor's result a cross-worker
# handoff (`task_submit` / `dispatch_task` with a `handoff` field) may inject into
# the successor's prompt. The injected block is wrapped as untrusted data and
# truncated on a UTF-8 boundary, so a large upstream artifact cannot bloat or
# hijack the downstream prompt.
# limits:
#   maxDelegationDepth: 8        # default 8; lower it for tighter environments
#   maxConcurrentTasks: 0        # 0/omitted = unlimited in-flight tasks
#   maxQueuedTasks: 0            # 0/omitted = refuse over-cap; >0 = bounded queue
#   queueTtlMs: 0                # 0/omitted = a queued task may wait forever
#   maxOutputBytes: 1048576      # default 1 MiB of persisted result text/task
#   maxHandoffBytes: 262144      # default 256 KiB of predecessor result injected per handoff

defaults:
  # acpx permission mode for workers: deny-all | approve-reads | approve-all
  permissionMode: approve-all
  # default working directory for workers (defaults to the process cwd)
  # cwd: /path/to/repo

profiles:
  # --- deterministic mocks: run anywhere, no API keys, no cost ---------------
  - name: mock-analyst
    driver: mock
    description: read-only research/analysis stand-in (mock)
    mock: { delayMs: 20, toolCalls: 2 }

  - name: mock-implementer
    driver: mock
    description: code-writing stand-in (mock)
    mock: { delayMs: 20, toolCalls: 3 }

  - name: mock-approver
    driver: mock
    description: blocks on a permission request before finishing (mock)
    mock: { delayMs: 10, requireApproval: true }

  # --- real agents driven over ACP via acpx ----------------------------------
  # Requires the upstream CLI installed + authenticated on this machine.
  # `agent` is an acpx built-in name (pi -> `npx pi-acp`, opencode -> `npx -y opencode-ai acp`).

  - name: pi
    driver: acpx
    agent: pi
    description: Pi coding agent worker (ACP via pi-acp)
    worktree: true          # isolate parallel edits in a git worktree

  - name: opencode
    driver: acpx
    agent: opencode
    description: OpenCode worker (ACP via `opencode acp`)
    worktree: true

  # Example: a real agent with an explicit custom launch command + model.
  # - name: opencode-sonnet
  #   driver: acpx
  #   agent: opencode-custom
  #   command: ["npx", "-y", "opencode-ai", "acp"]
  #   model: anthropic/claude-sonnet-4-5
  #   permissionMode: approve-reads
  #   worktree: true

  # --- remote workers: a profile that lives on a Worker Daemon (machine B) ----
  # The daemon wraps the same local stack behind HTTP+WS; here you only point at
  # it. ACP stdio never crosses the network — the daemon runs ACP locally and
  # forwards typed task events back to the master.
  #
  # - name: big-gpu-impl
  #   driver: remote
  #   description: remote implementer running on the GPU box
  #   remote:
  #     endpoint: https://gpu.example.com:8790   # wss:// is derived automatically
  #     tokenEnv: AGENTMESH_REMOTE_TOKEN          # VALUE read from env, never here
  #     remoteProfile: opencode                   # which daemon-side profile to run
  #     resume: true                              # auto re-attach if the socket drops
  #     reconnectAttempts: 3                      # (needs daemon orphanGraceMs > 0)
  #     reconnectDelayMs: 500
  #     # ca: ./certs/daemon-ca.pem               # trust a self-signed daemon cert
  #     # cert: ./certs/client.pem                # optional mTLS client cert
  #     # key:  ./certs/client-key.pem
  #     # connectTimeoutMs: 15000

# --- Worker Daemon (host side) ----------------------------------------------
# Only meaningful on the machine running `agentmesh daemon`. Defaults can be
# overridden per-launch with --host/--port/--token-env/--tls-cert/--tls-key.
#
# daemon:
#   host: 127.0.0.1              # non-loopback bind REQUIRES tls (or --allow-insecure)
#   port: 8790
#   tokenEnv: AGENTMESH_DAEMON_TOKEN   # daemon refuses to start if the env var is unset
#                                      # rotate with no downtime: list several names
#                                      # (VAR_OLD,VAR_NEW) or several comma-separated
#                                      # values in one var, then send SIGHUP to reload
#   allowCwd:                    # a remote task's cwd must sit inside one of these
#     - /srv/agentmesh/repos
#   tls:
#     cert: ./certs/daemon.pem
#     key:  ./certs/daemon-key.pem
#     # ca: ./certs/client-ca.pem      # enables mTLS client verification
#   exposeProfiles: [opencode, pi]      # default: every non-remote profile
#   orphanGraceMs: 30000                # keep a dropped task alive 30s so a client
#                                       # can `attach` and resume it (0 = cancel now)
#   auditPath: /var/log/agentmesh/daemon-audit.ndjson   # append-only NDJSON trail of
#                                       # auth/submit/approve/cancel/reload decisions;
#                                       # secrets are logged only as a hash fingerprint.
#                                       # default: <workdir>/daemon-audit.ndjson; "" disables
